<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0a0a0f">
<meta name="robots" content="noindex">
<title>Jukebox de la classe</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=1795777882">
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo"><span class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i></span></div>
    <div><h1>Jukebox</h1><p>Ajoute ta musique à la file de la classe.</p></div>
  </div>
  <div class="status" id="status"><i></i><span>Connexion…</span></div>
</header>

<main class="wrap">
  <h2>En cours</h2>
  <div id="nowbox"></div>

  <h2>Ajouter un titre</h2>
  <form id="sform" autocomplete="off" role="search">
    <div class="searchbar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="q" maxlength="100" placeholder="Titre ou artiste" enterkeyhint="search" aria-label="Rechercher un titre ou un artiste">
      <button class="lime" type="submit">Chercher</button>
    </div>
  </form>
  <div class="namefield">
    <label for="name">Ton prénom</label>
    <input type="text" id="name" maxlength="24" autocomplete="given-name" placeholder="Facultatif">
  </div>
  <p class="note" id="limit"></p>
  <ul class="list" id="results" aria-live="polite"></ul>

  <h2>File d'attente <span class="badge" id="count"></span></h2>
  <ul class="list" id="queue"></ul>
</main>
<div class="toast" id="toast" role="status"></div>

<script src="common.js?v=1795777882"></script>
<script>
{
  const $ = id => document.getElementById(id);
  const { esc, store, uid, send, subscribe, makeState, apply, queue, timeline, ACTIVE, dzSearch, fmtDur, norm, MAX_PER_PERSON } = JBX;
  const room = JBX.roomFromUrl();
  const S = makeState();
  const toast = JBX.toaster($('toast'));
  const anim = JBX.animator(), animR = JBX.animator();
  let results = [], lastQ = '', busy = false, sig = '';

  const setStatus = on => { $('status').classList.toggle('on', on); $('status').lastElementChild.textContent = on ? 'En direct' : 'Reconnexion…'; };
  const mine = () => [...timeline(S).up, ...queue(S)].filter(t => t.u === uid()).length;
  const cover = t => t.cover ? `<img src="${esc(t.cover)}" alt="" loading="lazy">` : '<span class="ph"></span>';

  $('name').value = store.get('jbx-name') || '';
  $('name').addEventListener('change', () => store.set('jbx-name', $('name').value.trim()));
  let raf = 0;
  const schedule = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; render(); }); };
  subscribe(room, (ev, m) => { apply(S, ev, m); schedule(); }, setStatus);

  function render() {
    const tl = timeline(S), q = queue(S), n = mine();
    const by = t => t.by ? ' · ' + esc(t.by) : '';
    sig = (tl.cur ? tl.cur.k : '') + '|' + tl.up.length + '|' + tl.paused + '|' + (tl.cur ? tl.cur.nts : '');
    document.body.classList.toggle('idle', !tl.cur);
    $('nowbox').innerHTML = JBX.nowCard(tl);
    const all = [...tl.up.map(t => [t, true]), ...q.map(t => [t, false])];
    const fresh = anim(all.map(([t]) => t.k));
    let j = 0;
    $('queue').innerHTML = all.length ? all.map(([t, nx], i) => {
      const f = fresh.has(t.k);
      return `<li class="row${nx ? ' next' : ''}${f ? ' new' : ''}"${f ? ` style="--i:${j++}"` : ''}><span class="n">${i + 1}</span>${cover(t)}<div><div class="t">${esc(t.title)}</div><div class="a">${esc(t.artist)}${by(t)}</div></div>
        <div class="acts"><span class="badge${nx ? ' lime' : ''}">${nx ? 'Prochain' : 'Demandé'}</span></div></li>`;
    }).join('') : '<li class="empty">La file est vide. Lance la soirée avec le premier titre.</li>';
    $('count').textContent = all.length || '';
    $('count').hidden = !all.length;
    $('limit').textContent = n >= MAX_PER_PERSON ? `Tu as ${n} titres en attente, maximum atteint. Attends qu'un de tes titres passe.` : (n ? `Tes titres en attente : ${n}/${MAX_PER_PERSON}` : '');
    renderResults();
  }
  setInterval(() => {
    const tl = timeline(S);
    if ((tl.cur ? tl.cur.k : '') + '|' + tl.up.length + '|' + tl.paused + '|' + (tl.cur ? tl.cur.nts : '') !== sig) return render();
    JBX.tick(tl);
  }, 1000);

  function renderResults() {
    const full = mine() >= MAX_PER_PERSON;
    const fresh = animR(results.map(r => String(r.id)));
    const rows = results.map((r, i) => {
      const k = 'dz:' + r.id, t = S.tracks.get(k), inQ = t && ACTIVE.includes(t.status);
      const img = JBX.safeCover(r.album && r.album.cover_small);
      const f = fresh.has(String(r.id));
      return `<li class="row res${f ? ' new' : ''}" style="--i:${i}">${img ? `<img src="${esc(img)}" alt="" loading="lazy">` : '<span class="ph"></span>'}
        <div><div class="t">${esc(r.title)}${r.explicit_lyrics ? ' <span class="badge">E</span>' : ''}</div><div class="a">${esc(r.artist && r.artist.name)} · ${fmtDur(r.duration)}</div></div>
        <div class="acts">${inQ ? '<button class="added" disabled>✓ Dans la file</button>' : `<button class="lime icon" data-i="${i}" ${full ? 'disabled' : ''} aria-label="Ajouter ${esc(r.title)}">+</button>`}</div></li>`;
    });
    if (lastQ) rows.push(`<li class="note" style="padding:6px 2px">Pas le bon titre ? <button class="ghost" id="free" ${full ? 'disabled' : ''} style="min-height:38px;margin-left:6px">Demander « ${esc(lastQ)} »</button></li>`);
    $('results').innerHTML = rows.join('');
  }

  $('sform').addEventListener('submit', async e => {
    e.preventDefault();
    const q = $('q').value.trim(); if (!q || busy) return;
    $('q').blur();
    busy = true; lastQ = q; $('results').innerHTML = '<li class="note">Recherche…</li>';
    try { results = await dzSearch(q); if (!results.length) toast('Aucun résultat sur Deezer.', true); }
    catch (_) { results = []; toast('Recherche indisponible : envoie ta demande en texte.', true); }
    busy = false; renderResults();
  });

  async function add(ev) {
    if (mine() >= MAX_PER_PERSON) return toast('Maximum de titres en attente atteint.', true);
    ev.t = 'add'; ev.by = $('name').value.trim().slice(0, 24); store.set('jbx-name', ev.by);
    try { await send(room, ev); toast('Ajouté à la file ✓'); results = []; lastQ = ''; $('q').value = ''; renderResults(); }
    catch (err) { toast(err.message, true); renderResults(); }
  }

  $('results').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    if (b.id === 'free') {
      const k = 'txt:' + norm(lastQ); if (!norm(lastQ)) return;
      return add({ k, title: lastQ.slice(0, 100), artist: 'Demande libre' });
    }
    const r = results[+b.dataset.i]; if (!r) return;
    b.disabled = true; b.textContent = '…';
    add({ k: 'dz:' + r.id, id: r.id, title: r.title, artist: r.artist && r.artist.name, cover: r.album && r.album.cover_small, dur: r.duration });
  });

  render();
}
</script>
</body>
</html>
